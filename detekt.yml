# Factory-owned file: agents must not edit it. detekt's default rules plus these; any finding fails
# the lint gate (maxIssues 0, warnings are errors).
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

# KDoc on the public API of the library (tests are not public API).
comments:
  UndocumentedPublicClass:
    active: true
    excludes: ['**/test/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**']

# The package is io.github.trysac.<module>, where the module name keeps the underscores of the
# utility name (as in Java); detekt's default pattern has none.
naming:
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'
